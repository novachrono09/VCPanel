name: Build SquadComms APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Make Gradlew Executable
        run: chmod +x gradlew

      - name: Build Release APK (R8 Shrunk)
        run: ./gradlew assembleRelease

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete v2.2.0 --yes || true
          git tag -d v2.2.0 || true
          git push origin :refs/tags/v2.2.0 || true
          gh release create v2.2.0 app/build/outputs/apk/release/*.apk \
            --title "VOX v2.2.0 (Full-Panel Theming Overhaul, Custom Color Picker & Handle Voice Blink Toggle)" \
            --notes "VOX v2.2.0 Major Update: Complete full-panel dynamic theming engine (chassis border and lip, tab buttons and indicators, header telemetry, action keycaps, roster speaking borders and telemetry rails, gain seekbars, ping buttons, and all settings buttons), 360-degree rainbow spectrum Hue slider + custom Hex entry color picker, and Speaking Blink Indicator toggle for the edge slider pill."
