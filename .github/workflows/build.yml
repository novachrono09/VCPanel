name: Build SquadComms APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Make Gradlew Executable
        run: chmod +x gradlew

      - name: Build Release APK (R8 Shrunk)
        run: ./gradlew assembleRelease

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete v2.0.0 --yes || true
          git tag -d v2.0.0 || true
          git push origin :refs/tags/v2.0.0 || true
          gh release create v2.0.0 app/build/outputs/apk/release/*.apk \
            --title "VOX v2.0.0 (Zero-Load Engine: 24k Opus, Zero Dots/PTT Bloat, Screen-Off Sleep & 32-bit Compatibility)" \
            --notes "VOX v2.0.0 Major Performance Architecture Milestone: Completely stripped dots and PTT overhead, consolidated to 1 single lightweight hardware window, reduced audio to 24kbps Opus wideband with DTX silence suppression, registered ACTION_SCREEN_OFF power gating to halt all frame loops when screen is dark, eliminated runtime color and view allocations, bundled universal arm64-v8a + armeabi-v7a native libraries, and enabled largeHeap."
