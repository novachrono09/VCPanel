name: Build SquadComms APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Make Gradlew Executable
        run: chmod +x gradlew

      - name: Build Release APK (R8 Shrunk)
        run: ./gradlew assembleRelease

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete v2.1.0 --yes || true
          git tag -d v2.1.0 || true
          git push origin :refs/tags/v2.1.0 || true
          gh release create v2.1.0 app/build/outputs/apk/release/*.apk \
            --title "VOX v2.1.0 (Dynamic Column Navigation Rail & Top-Tier 5-Pillar Customization Suite)" \
            --notes "VOX v2.1.0 Major Customization Release: Dynamic vertical icon-only tab rail that flips to left/right border to match edge docking side, new full-featured Settings tab with all 5 customization pillars (6 tactical accent swatches, chassis opacity slider, deck scaling, ghost idle fade, handle width/height, docking lock, audio bitrate presets, chime modes, haptic strength, ping alert filters, auto-collapse timers, and swipe sensitivity)."
