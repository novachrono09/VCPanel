name: Build SquadComms APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Make Gradlew Executable
        run: chmod +x gradlew

      - name: Build Release APK (R8 Shrunk)
        run: ./gradlew assembleRelease

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(grep 'versionName =' app/build.gradle.kts | head -n 1 | cut -d '"' -f 2)
          TAG="v$VERSION"
          echo "Publishing release for $TAG"
          gh release delete "$TAG" --yes || true
          git tag -d "$TAG" || true
          git push origin :refs/tags/"$TAG" || true
          gh release create "$TAG" app/build/outputs/apk/release/*.apk \
            --title "VOX $TAG" \
            --notes "VOX $TAG Release: Direct In-App Updates, Specific Person Mutual Mute, and Tactical HUD improvements." \
            --latest
