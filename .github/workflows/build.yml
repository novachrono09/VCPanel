name: Build SquadComms APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Make Gradlew Executable
        run: chmod +x gradlew

      - name: Build Release APK (R8 Shrunk)
        run: ./gradlew assembleRelease

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete v1.7.0 --yes || true
          git tag -d v1.7.0 || true
          git push origin :refs/tags/v1.7.0 || true
          gh release create v1.7.0 app/build/outputs/apk/release/*.apk \
            --title "VOX v1.7.0 (In-Overlay Channel Switcher & Conflict-Free Drag Header)" \
            --notes "Dedicated In-Overlay [CHANNELS] tab for instant frequency hopping by code, dynamic recent channel history preserving custom codes, conflict-free header drag zone, and intelligent soft keyboard focus management."
