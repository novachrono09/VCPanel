name: Build SquadComms APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Make Gradlew Executable
        run: chmod +x gradlew

      - name: Build Release APK (R8 Shrunk)
        run: ./gradlew assembleRelease

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete v1.3.0 --yes || true
          git tag -d v1.3.0 || true
          git push origin :refs/tags/v1.3.0 || true
          gh release create v1.3.0 app/build/outputs/apk/release/*.apk \
            --title "SquadComms v1.3.0 (Permanent Keystore & Tactical PTT Suite)" \
            --notes "Permanent release keystore for seamless in-place updates without uninstalling, synthesized tactical audio chimes via ToneGenerator, dual-mode Push-To-Talk (PTT) with radio key chirps and squelch tones, instant in-overlay channel cycler, and P2P squad haptic alert pings."
