name: Build SquadComms APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Make Gradlew Executable
        run: chmod +x gradlew

      - name: Build Release APK (R8 Shrunk)
        run: ./gradlew assembleRelease

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete v1.9.0 --yes || true
          git tag -d v1.9.0 || true
          git push origin :refs/tags/v1.9.0 || true
          gh release create v1.9.0 app/build/outputs/apk/release/*.apk \
            --title "VOX v1.9.0 (Zero-Latency PTT, Floating Constellation Dots & Fluid Edge Snapping)" \
            --notes "VOX v1.9.0 major polish: Instant push-to-talk by holding edge slider or tactical keycap, synchronized zero-lag closing drawer animation, free-form 2D slider dragging with left-edge default and magnetic snapping, swipe anywhere on panel to close, borderless floating organic constellation speaking dots with circle-to-square morph physics, and modern vector icon drawables across all actions."
