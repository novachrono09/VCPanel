name: Build SquadComms APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Make Gradlew Executable
        run: chmod +x gradlew

      - name: Build Release APK (R8 Shrunk)
        run: ./gradlew assembleRelease

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete v1.8.0 --yes || true
          git tag -d v1.8.0 || true
          git push origin :refs/tags/v1.8.0 || true
          gh release create v1.8.0 app/build/outputs/apk/release/*.apk \
            --title "VOX v1.8.0 (Side Slider Panel, Edge Docking, Corner Speaking Dots & Zero Emojis)" \
            --notes "Tactical VOX v1.8.0 evolution: Edge slider tab docked seamlessly to left or right screen borders, slide-in/slide-out chassis animation, click-through corner member speaking dots with spring overshoot physics, deck header dot toggle [DOTS:ON/OFF], and complete zero-emoji tactical interface."
