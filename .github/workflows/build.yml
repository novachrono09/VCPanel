name: Build SquadComms APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Make Gradlew Executable
        run: chmod +x gradlew

      - name: Build Release APK (R8 Shrunk)
        run: ./gradlew assembleRelease

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete v1.9.1 --yes || true
          git tag -d v1.9.1 || true
          git push origin :refs/tags/v1.9.1 || true
          gh release create v1.9.1 app/build/outputs/apk/release/*.apk \
            --title "VOX v1.9.1 (Battery & Low-RAM Optimization: 32kbps Opus, Memory Leak Fix & Universal 32/64-bit)" \
            --notes "VOX v1.9.1 Critical Stability & Battery Update: 75% reduction in radio battery draw (32kbps Opus wideband + DTX silence suppression), fixed leaked animators in global AnimationHandler, removed dual hardware-accelerated EGL surfaces on low-RAM GPUs, added 32-bit armeabi-v7a support for budget Android phones, enabled largeHeap, and added speech hangover debouncing to prevent syllable animation thrashing."
